[[testers]]
id = "supra-libft"
name = "Supra libft tester"
projects = ["libft"]
platforms = ["linux", "darwin"]
architectures = ["amd64"]
repository = "https://github.com/nda-cunh/libft_tester.git"
ref = "fa0062fe805ff55179ad4bfd5ccd8d19d3c330fd"
context = "."
recipe = "supra"
command = ["/opt/tester/bin/libft_tester"]

[[testers]]
id = "supra-printf"
name = "Supra printf tester"
projects = ["ft_printf"]
platforms = ["linux", "darwin"]
architectures = ["amd64", "arm64"]
repository = "https://github.com/HeduroFR/printf_tester.git"
ref = "f5c6484ab94efdfad0a65bbe8b88be93459c0d05"
context = "."
recipe = "supra"
command = ["timeout", "--signal=TERM", "--kill-after=5s", "600s", "/opt/tester/bin/printf_tester", "--report", "/project/.42tui-printf-result.json"]
result_file = ".42tui-printf-result.json"
interactive_input = false

[[testers]]
id = "tripouille-gnl"
name = "Tripouille get_next_line tester"
projects = ["get_next_line"]
platforms = ["linux", "darwin"]
architectures = ["amd64", "arm64"]
repository = "https://github.com/HeduroFR/gnlTester.git"
ref = "00966acf582fb4531ffb3c808bd34b6e0987a46d"
context = "."
recipe = "gnl"
command = ["/opt/gnl.sh"]
result_file = ".42tui-gnl-result.json"
interactive_input = false

[[testers]]
id = "ft-ps-tester"
name = "Push_swap tester"
projects = ["push_swap"]
platforms = ["linux", "darwin"]
architectures = ["amd64", "arm64"]
runtime = "native"
repository = "https://github.com/italoalmeida0/ft_ps_tester.git"
ref = "49cf9c702812ec3fc1f9d5a1d34bb8d87c073214"
context = "."
prepare = [["make"]]
command = ["{python}", "{source}/ft_ps_tester/cli.py", "{project}/push_swap"]
