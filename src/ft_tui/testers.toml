[[testers]]
id = "supra-libft"
name = "Supra libft tester"
projects = ["libft"]
platforms = ["linux", "darwin"]
architectures = ["amd64"]
repository = "https://github.com/nda-cunh/libft_tester.git"
ref = "fa0062fe805ff55179ad4bfd5ccd8d19d3c330fd"
context = "."
recipe = "supra"
command = ["/opt/tester/bin/libft_tester"]

[[testers]]
id = "supra-printf"
name = "Supra printf tester"
projects = ["ft_printf"]
platforms = ["linux", "darwin"]
architectures = ["amd64"]
repository = "https://github.com/nda-cunh/printf_tester.git"
ref = "53468a42fc2a51d33ffd65d7ef853c51223ac9e6"
context = "."
