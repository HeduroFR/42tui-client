name: Python release checks
on:
  pull_request:
  workflow_call:
    outputs:
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
permissions:
  contents: read
concurrency:
  group: python-release-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Package and installer checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
      regression-matrix: ${{ steps.regression-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.3 twine
      - run: uv build
      - run: python release/check_package.py dist
      - run: python -m twine check --strict dist/*
      - name: Rebuild from source distribution
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          uv build --wheel "$RUNNER_TEMP"/sdist/ft_tui-* --out-dir "$RUNNER_TEMP/rebuilt"
          python -m pip install "$RUNNER_TEMP"/rebuilt/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/release/smoke_package.py"
      - run: python -m pip install dist/*.whl
      - name: Fast installer tests
        run: python -m unittest discover -s tests -p 'test_installer*.py'
      - name: Fast release tests
        run: python -m unittest discover -s tests -p 'test_release*.py'
      - name: Check cross-platform fixture paths
        run: python -m unittest discover -s tests -p test_fixture_portability.py
      - name: Verify regression scope assignments
        id: regression-matrix
        run: |
          python -m unittest discover -s tests -p test_regression_scopes.py
          python release/regression_scopes.py --check
          matrix="$(python release/regression_scopes.py --matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Verify installer helper digests
        run: python release/installer_hashes.py
      - id: artifact
        shell: bash
        run: echo "name=python-distributions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  regression-tests:
    name: Regression · ${{ matrix.scope }}
    needs: build
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.regression-matrix) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      - run: python -m pip install uv==0.13.3 dist/*.whl
      - name: Run the complete feature scope, including its UI tests
        env:
          REGRESSION_SCOPE: ${{ matrix.scope }}
        run: python release/regression_scopes.py --scope "$REGRESSION_SCOPE" --durations 20
  supported-platforms:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      - run: python -m pip install uv==0.13.3 dist/*.whl
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/release/smoke_package.py"
      - name: Exercise real uv tool lifecycle with candidate wheel
        shell: bash
        run: python release/smoke_install.py "$(find dist -name '*.whl' -print -quit)" "$(command -v uv)"
      - run: sh -n distribution/install.sh && sh -n distribution/uninstall.sh
  campus-python310:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      - name: Non-root Ubuntu 22.04 with only system Python 3.10
        run: docker build -f release/ubuntu2204.Dockerfile .
  distribution-container:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker build -t 42tui-distribution distribution
      - name: Verify static routes
        shell: bash
        run: |
          docker run --rm -d --name installer -p 127.0.0.1:8080:8080 42tui-distribution
          trap 'docker stop installer' EXIT
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          test "$(curl -fsS -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:8080/github)" = '301 https://github.com/HeduroFR/42tui-client'
          test "$(curl -fsS -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:8080/)" = '301 https://github.com/HeduroFR/42tui-client'
          test "$(curl -fsS -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:8080/discord)" = '301 https://discord.gg/QrRBcK5MeP'
          for name in install.sh install.ps1 install.py uninstall.sh; do
            curl -fsS "http://127.0.0.1:8080/$name" -o "$RUNNER_TEMP/$name"
            cmp "distribution/$name" "$RUNNER_TEMP/$name"
          done
