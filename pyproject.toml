[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ft-tui"
version = "0.4.1"
description = "Offline-first terminal workspace for École 42 students"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual[syntax]>=8.2,<9.0",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-markdown>=0.5,<0.6",
    "rich>=13.7,<15.0",
    "SQLAlchemy>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "Pillow>=11,<14",
    "textual-image[textual]>=0.14.1,<0.15",
    "keyring>=25.0,<26.0",
    "cryptography>=42.0,<46.0",
]

[project.scripts]
42tui = "ft_tui.main:main"
42goto = "ft_tui.goto:main"
42tui-zed-lsp = "ft_tui.integrations.zed_lsp:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ft_tui", "ft_tui.*"]

[tool.setuptools.package-data]
ft_tui = ["locales/*.json", "testers.toml"]
"ft_tui.features.cluster_map" = ["layout.json"]

[tool.ruff]
line-length = 120
target-version = "py312"
