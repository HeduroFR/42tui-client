server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    location = /github {
        return 301 https://github.com/HeduroFR/42tui-client;
    }
    location = /discord {
        return 301 https://discord.gg/QrRBcK5MeP;
    }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location ~ ^/(install\.(sh|ps1|py)|uninstall\.sh)$ {
        types { }
        default_type text/plain;
        try_files $uri =404;
    }
    location = / {
        return 301 https://github.com/HeduroFR/42tui-client;
    }
    location / {
        return 404;
    }
}
